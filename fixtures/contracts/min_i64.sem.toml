contract_version = "0.1"

[function]
name = "min_i64"
summary = "Return the smaller of two signed 64-bit integers"

[[function.parameters]]
name = "a"
type = "i64"
role = "input"

[[function.parameters]]
name = "b"
type = "i64"
role = "input"

[[function.returns]]
name = "result"
type = "i64"

[[function.ensures]]
expression = "result <= a"

[[function.ensures]]
expression = "result <= b"

[function.constraints]
no_heap = true
no_recursion = true
bounded_stack_bytes = 64
