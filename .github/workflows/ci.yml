name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Doc
        run: cargo doc --workspace --no-deps

      - name: Contributor quickstart
        shell: bash
        run: bash scripts/quickstart.sh

      - name: Prepare source packages
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --workspace --no-verify --allow-dirty

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace on MSRV
        run: cargo +1.85 check --workspace --all-targets --locked

      - name: Test workspace on MSRV
        run: cargo +1.85 test --workspace --no-default-features --locked

  linux-e2e:
    name: e2e (x86-64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm binutils qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Record tool versions
        run: |
          nasm --version
          ld --version | head -n 1
          objdump --version | head -n 1

      - name: Run Linux build, inspect, execute, and report scenarios
        run: |
          cargo test -p semasm-build -- --ignored --nocapture
          cargo test -p semasm-obj -- --ignored --nocapture

      - name: Verify canonical evidence across output roots
        shell: bash
        run: |
          set -euo pipefail
          first_root="$(mktemp -d)"
          second_root="$(mktemp -d)"
          trap 'rm -rf "$first_root" "$second_root"' EXIT
          cargo run -q -p semasm-cli -- build fixtures/asm/exit.asm \
            --target x86_64-unknown-linux-gnu --out-dir "$first_root" \
            --no-run --format json > "$first_root/report.json"
          cargo run -q -p semasm-cli -- build fixtures/asm/exit.asm \
            --target x86_64-unknown-linux-gnu --out-dir "$second_root" \
            --no-run --format json > "$second_root/report.json"
          first_hash="$(jq -er '.deterministic_evidence_sha256' "$first_root/report.json")"
          second_hash="$(jq -er '.deterministic_evidence_sha256' "$second_root/report.json")"
          test "$first_hash" = "$second_hash"

      - name: Record Linux conformance
        shell: bash
        run: |
          mkdir -p target/conformance
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          jq -n \
            --arg version "$version" --arg commit "$GITHUB_SHA" \
            --arg runner "$RUNNER_OS/$RUNNER_ARCH" \
            '{
              schema_version: "0.1", tool_version: $version, commit: $commit,
              target: "x86_64-unknown-linux-gnu", runner: $runner,
              outcome: "passed", reason: null,
              evidence: [
                "semasm-build ignored e2e suite",
                "semasm-obj ignored negative/e2e suite",
                "canonical evidence hash across independent roots"
              ]
            }' > target/conformance/x86_64-unknown-linux-gnu.json

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-x86_64-linux
          path: target/conformance/*.json
          if-no-files-found: error
          retention-days: 30

  windows-e2e:
    name: e2e (x86-64 Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: choco install nasm llvm --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Record tool versions
        shell: pwsh
        run: |
          nasm --version
          lld-link --version

      - name: Run Windows PE build, inspect, and execute scenario
        run: cargo test -p semasm-build pipeline::tests::build_windows_pe_and_run -- --ignored --exact --nocapture

      - name: Win64 agent semantic gates and verify
        env:
          SEMASM_REQUIRE_TOOLCHAIN: "1"
        run: |
          cargo test -p semasm-cli --all-features commands::semantic_gate_tests::win64_candidate_passes_static_semantic_gates -- --ignored --exact --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_win64_execution_denied -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_win64_allow_execution -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_min_usize_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_max_usize_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_max_i64_cmov_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_find_first_byte_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_find_last_byte_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memcmp_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_replace_byte_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memset_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memcpy_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_sum_i64_win64 -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_adversarial _win64_ -- --ignored --nocapture

      - name: Record Windows conformance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/conformance | Out-Null
          $version = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$' |
            Select-Object -First 1 |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          [ordered]@{
            schema_version = "0.1"
            tool_version = $version
            commit = $env:GITHUB_SHA
            target = "x86_64-pc-windows-msvc"
            runner = "$env:RUNNER_OS/$env:RUNNER_ARCH"
            outcome = "passed"
            reason = $null
            evidence = @(
              "Windows PE build/inspect/native execution"
              "Win64 static semantic gates"
              "Win64 behavioral and adversarial corpus"
            )
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 target/conformance/x86_64-pc-windows-msvc.json

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-x86_64-windows
          path: target/conformance/*.json
          if-no-files-found: error
          retention-days: 30

  cross-target-e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AArch64 Linux
            prefix: aarch64-linux-gnu
            package: binutils-aarch64-linux-gnu
            runner: qemu-aarch64
            target: aarch64-unknown-linux-gnu
            source: fixtures/asm/exit_aarch64.S
          - name: RV64 Linux
            prefix: riscv64-linux-gnu
            package: binutils-riscv64-linux-gnu
            runner: qemu-riscv64
            target: riscv64gc-unknown-linux-gnu
            source: fixtures/asm/exit_riscv64.S
    steps:
      - uses: actions/checkout@v7

      - name: Install cross-target tools
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }} qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Assemble, link, inspect, and execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/cross-evidence
          object="target/cross-evidence/${{ matrix.prefix }}.o"
          executable="target/cross-evidence/${{ matrix.prefix }}"
          ${{ matrix.prefix }}-as "${{ matrix.source }}" -o "$object"
          ${{ matrix.prefix }}-ld -static -e _start "$object" -o "$executable"
          cargo run -q -p semasm-cli -- obj "$executable" --target "${{ matrix.target }}" --format json
          set +e
          ${{ matrix.runner }} "$executable"
          status=$?
          set -e
          test "$status" -eq 42

      - name: Agent static semantic gates for count_byte
        env:
          SEMASM_REQUIRE_TOOLCHAIN: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo test -p semasm-cli --all-features commands::semantic_gate_tests::aarch64_candidate_passes_static_semantic_gates -- --ignored --exact --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcmp_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_replace_byte_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memset_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcpy_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcpy_unknown_address_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_find_first_byte_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_find_last_byte_aarch64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_adversarial _aarch64_ -- --ignored --nocapture
          else
            cargo test -p semasm-cli --all-features commands::semantic_gate_tests::riscv64_candidate_passes_static_semantic_gates -- --ignored --exact --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcmp_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_replace_byte_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memset_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcpy_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_memcpy_unknown_address_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_find_first_byte_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_cross_target agent_verify_find_last_byte_riscv64 -- --ignored --nocapture
            cargo test -p semasm-cli --all-features --test agent_verify_adversarial _riscv64_ -- --ignored --nocapture
          fi

      - name: Record cross-target conformance
        shell: bash
        run: |
          mkdir -p target/conformance
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          safe_target="$(printf '%s' '${{ matrix.target }}' | tr -c 'A-Za-z0-9._-' '_')"
          jq -n \
            --arg version "$version" --arg commit "$GITHUB_SHA" \
            --arg runner "$RUNNER_OS/$RUNNER_ARCH" \
            --arg target "${{ matrix.target }}" \
            '{
              schema_version: "0.1", tool_version: $version, commit: $commit,
              target: $target, runner: $runner, outcome: "passed", reason: null,
              evidence: [
                "cross assemble/link/object inspection/QEMU execution",
                "target static semantic gate",
                "target behavioral and adversarial corpus"
              ]
            }' > "target/conformance/${safe_target}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.name }}
          path: target/conformance/*.json
          if-no-files-found: error
          retention-days: 30

  decode:
    name: decode (capstone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nasm and verification tools
        run: sudo apt-get update && sudo apt-get install -y nasm binutils qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (capstone feature)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (capstone feature)
        run: cargo test --workspace --all-features

      - name: Region/Alias Evidence v1 corpus
        run: |
          cargo test -p semasm-cli --all-features --test alias_evidence_v1 -- --nocapture
          cargo test -p semasm-contract --lib alias:: -- --nocapture
          cargo test -p semasm-cli --all-features memory_effects -- --nocapture

      - name: Contract Expression Semantics v1 corpus
        run: |
          cargo test -p semasm-cli --all-features --test contract_expr_v1 -- --nocapture
          cargo test -p semasm-contract --lib eval:: -- --nocapture

      - name: Agent semantic-gate and verify integration tests
        run: |
          cargo test -p semasm-cli --all-features \
            commands::semantic_gate_tests::canonical_candidate_passes_static_semantic_gates \
            -- --ignored --exact --nocapture
          cargo test -p semasm-cli --all-features \
            commands::semantic_gate_tests::win64_candidate_passes_static_semantic_gates \
            -- --ignored --exact --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_execution_denied \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_sysv_allow_execution \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_min_usize \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_max_usize \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_max_i64_cmov \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_find_first_byte \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_find_last_byte \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memcmp \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_replace_byte \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memset \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_memcpy \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_sum_i64 \
            -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_verify_adversarial _sysv_ -- --ignored --nocapture
          cargo test -p semasm-cli --all-features --test agent_evidence_compare _sysv_ -- --ignored --nocapture
        env:
          SEMASM_REQUIRE_TOOLCHAIN: "1"

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: CLI decode smoke
        run: |
          printf '\x31\xc0\xc3' > /tmp/sample.bin
          cargo run -q -p semasm-cli --features capstone -- decode /tmp/sample.bin --base 0
          printf '\x31\xc0\x48\xff\xc9\x75\xfb\xc3' > /tmp/loop.bin
          cargo run -q -p semasm-cli --features capstone -- cfg /tmp/loop.bin --base 0x1000

  # Optional advisory job; continues on missing cargo-deny in older setups
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  reliability:
    name: reliability stress
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Process timeout and bounded-capture regression suite
        run: |
          cargo test -p semasm-build exec::tests::timeout_ -- --nocapture
          cargo test -p semasm-build exec::tests::large_flood_is_drained_but_bounded -- --exact --nocapture
          cargo test -p semasm-build exec::tests::simultaneous_stream_floods_are_independently_bounded -- --exact --nocapture
          cargo test -p semasm-build exec::tests::invalid_utf8_capture_remains_binary_safe -- --exact --nocapture

  performance:
    name: performance baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure release CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p semasm-cli
          target/release/semasm status >/dev/null
          start_ns="$(date +%s%N)"
          target/release/semasm status >/dev/null
          end_ns="$(date +%s%N)"
          elapsed_ms="$(( (end_ns - start_ns) / 1000000 ))"
          binary_bytes="$(stat -c %s target/release/semasm)"
          test "$elapsed_ms" -le 5000
          test "$binary_bytes" -le 15000000
          mkdir -p target/performance
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --argjson elapsed_ms "$elapsed_ms" \
            --argjson binary_bytes "$binary_bytes" \
            '{
              schema_version: "0.1", commit: $commit,
              command: "semasm status", warmed_elapsed_ms: $elapsed_ms,
              release_binary_bytes: $binary_bytes,
              ceilings: {warmed_elapsed_ms: 5000, release_binary_bytes: 15000000}
            }' > target/performance/baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: performance-baseline
          path: target/performance/baseline.json
          if-no-files-found: error
          retention-days: 30
